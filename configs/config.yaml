# Cấu hình dự án: Dự báo lượng mưa dưới ràng buộc độ trễ suy luận
# Trạm: Tân Sơn Nhất (WMO ID: 48900)
#
# LƯU Ý: File này ghi lại thiết lập thí nghiệm; code không nạp file này.
# Các giá trị thực sự có hiệu lực là hằng số trong src/ (ngày chia tập trong build_features.py,
# LATENCY_CONSTRAINT_MS trong latency.py, WINDOW_CANDIDATES / DEFAULT_SEEDS trong optimize_*.py).
# Sửa file này không làm thay đổi bất kỳ thí nghiệm nào.

project:
  name: "Rainfall Forecasting under Inference Latency Constraint"
  course: "Introduction to Optimization (Nhập môn Tối ưu hóa)"
  institution: "Faculty of Information Technology, Van Lang University"
  station_id: "48900"
  station_name: "Tan Son Nhat International Airport, Ho Chi Minh City"
  target_variable: "prcp"
  forecast_horizon_hours: 1
  timezone: "Asia/Ho_Chi_Minh"

constraints:
  latency_e2e_max_ms: 5.0
  device: "CPU"
  benchmark:
    n_runs: 200
    warmup: 20
    metric: "P95"
    # Giao thức đo (src/evaluation/latency.py):
    #   search: optimize_*.py, đã sinh ra results/optimization_history_*.csv (commit 1da4ab6):
    #           chọn cột DataFrame mỗi lần gọi + model.predict của scikit-learn, GC bật
    #   deploy: champion và bảng đối chuẩn: trích đặc trưng NumPy + booster_.predict, GC tạm dừng
    search_protocol: "search"
    deploy_protocol: "deploy"

splits:
  clean_period:
    start: "2023-01-01 00:00:00"
    end: "2025-12-31 23:59:59"
  train:
    target_end: "2024-12-31 23:59:59"
    description: "2023-2024 full years (17,544 hours)"
  validation:
    target_start: "2025-01-01 00:00:00"
    target_end: "2025-06-30 23:59:59"
    description: "2025 H1 dry & transition season (4,344 hours)"
  test:
    target_start: "2025-07-01 00:00:00"
    target_end: "2025-12-31 23:59:59"
    description: "2025 H2 peak monsoon season (4,416 hours)"

# Không gian đã sinh ra log 1.000 trial (tập giá trị rời rạc, trừ learning_rate). Đề cương dự kiến tới 500 cây,
# nhưng thực nghiệm chính thức chạy tới 300 cây; 400-500 cây để dành cho thực nghiệm mở rộng.
search_space:
  L_candidates: [1, 2, 3, 6, 12, 24, 36, 48, 72]
  hyperparameters:
    n_estimators: [20, 50, 100, 150, 200, 300]
    max_depth: [2, 3, 4, 6, 8, 10, 12]
    num_leaves: [7, 15, 31, 63, 127]
    learning_rate:
      low: 0.01
      high: 0.25
      log_scale: true
    min_child_samples: [10, 20, 50, 100]

budget:
  fair_comparison_trials_per_seed: 40  # Giai đoạn 1: So sánh trực tiếp, công bằng với cùng một ngân sách thấp
  scaling_trials_per_seed: 100         # Giai đoạn 2: Khảo sát hội tụ và bão hòa
  seeds: [42, 123, 456, 789, 2026]
  total_evaluations: 500

optimal_solution:
  method: "Optuna TPE"
  L_hours: 1
  n_estimators: 150
  max_depth: 12
  num_leaves: 15
  learning_rate: 0.0215
  min_child_samples: 20
  val_rmse: 0.8318
  test_rmse: 1.1774
  p95_latency_ms: 0.683
  p95_latency_range_ms: [0.66, 0.75]
  rain_event_f1: 0.5882
  status: "Feasible (<= 5.0 ms SLA, <= 4.5 ms safety margin)"
