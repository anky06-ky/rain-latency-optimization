name: CI Pipeline & Optimization Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Build, Audit & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Download Weather Dataset (Meteostat WMO 48900)
        run: |
          python src/data/download.py

      - name: 5. Execute Automated Unit Tests
        run: |
          pytest -v tests/

      - name: 6. Verify End-to-End Inference Demo
        run: |
          python src/demo_predict.py
